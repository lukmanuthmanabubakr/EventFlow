openapi: 3.0.3
info:
  title: EventFlow — Order Service
  description: >
    Handles order creation and lifecycle. Publishes OrderPlaced,
    PaymentSucceeded/PaymentFailed, and listens for InventoryReserved /
    InventoryFailed via RabbitMQ. This spec documents the HTTP surface
    only — for the full async event flow and payload shapes, see
    docs/event-catalog.json at the repo root.
  version: 0.4.0
servers:
  - url: http://localhost:5004
    description: Local development
tags:
  - name: Health
    description: Service liveness check
  - name: Orders
    description: Order creation and lookup
paths:
  /health:
    get:
      tags: [Health]
      summary: Confirms the service is running
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /orders:
    post:
      tags: [Orders]
      summary: Create a new order
      description: >
        Validates the request, saves the order as "pending", publishes an
        OrderPlaced event with a fresh correlation ID, then runs a
        (currently simulated) payment step, publishing PaymentSucceeded
        or PaymentFailed. The payment amount is computed dynamically as
        sum(quantity * unitPrice) across all items — unitPrice must be a
        real price the client obtained from GET /products on Inventory
        Service beforehand. Order Service trusts this price as given; it
        does not re-verify it against Inventory Service's actual data —
        a deliberate simplification until real cross-service
        verification is designed as part of Week 6's saga work. A failed
        payment sets the order's status to "failed" immediately — real
        saga/rollback logic is also Week 6's job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantity, unitPrice]
                    properties:
                      productId:
                        type: string
                        example: 9e1a9de6-09ad-41c8-a5cd-6691490888f4
                      quantity:
                        type: integer
                        minimum: 1
                        example: 2
                      unitPrice:
                        type: integer
                        description: >
                          Price per unit in cents, taken from GET /products.
                          Not verified server-side against Inventory
                          Service — see the endpoint description above.
                        minimum: 1
                        example: 8999
            example:
              items:
                - productId: 9e1a9de6-09ad-41c8-a5cd-6691490888f4
                  quantity: 2
                  unitPrice: 8999
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  order:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      correlationId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: pending
                      createdAt:
                        type: string
                        format: date-time
              example:
                status: ok
                order:
                  id: bbaa87b9-d1f5-4c16-a9a2-bade93c0ed4f
                  correlationId: 11226401-7567-480e-8fe3-835d3730f873
                  status: pending
                  createdAt: "2026-09-27T21:45:31.977Z"
        "400":
          description: Invalid request body (e.g. missing items, missing unitPrice)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
              example:
                status: error
                message: Invalid request body
                issues:
                  - path: items
                    message: "Invalid input: expected array, received undefined"

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Look up an order by id
      description: >
        Returns the current state of an order — useful for watching status
        change live as PaymentSucceeded/PaymentFailed and
        InventoryReserved/InventoryFailed events arrive.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  order:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      correlationId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: confirmed
                      items:
                        type: array
                        items:
                          type: object
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
              example:
                status: ok
                order:
                  id: bbaa87b9-d1f5-4c16-a9a2-bade93c0ed4f
                  correlationId: 11226401-7567-480e-8fe3-835d3730f873
                  items:
                    - productId: 9e1a9de6-09ad-41c8-a5cd-6691490888f4
                      quantity: 2
                      unitPrice: 8999
                  status: pending
                  createdAt: "2026-09-27T21:45:31.977Z"
                  updatedAt: "2026-09-27T21:45:31.977Z"
        "400":
          description: id is not a valid UUID
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
              example:
                status: error
                message: Invalid order id
                issues:
                  - path: id
                    message: id must be a valid UUID
        "404":
          description: No order exists with this id
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Order not found
              example:
                status: error
                message: Order not found
